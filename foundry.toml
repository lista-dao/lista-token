[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
cache_path  = 'cache_forge'
evm_version = "shanghai"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
bsc-test = "${BSC_TESTNET_RPC}"
bsc = "https://bsc-dataseed.bnbchain.org"
sepolia = "${ETH_SEPOLIA_RPC}"
ethereum = "${ETHEREUM_RPC}"

[etherscan]
bsc-test = { key = "${BSCSCAN_API_KEY}" }
bsc = { key = "${BSCSCAN_API_KEY}" }
